<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Presence">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Presence — Demo</title>
  <link rel="stylesheet" href="css/tokens.css?v=ap7">
  <link rel="stylesheet" href="css/base.css?v=ap7">
  <link rel="stylesheet" href="css/components.css?v=ap7">
  <link rel="stylesheet" href="css/screens.css?v=ap7">
</head>
<body>
  <!-- Demo-Regie (außerhalb des Telefons) -->
  <header id="stage-bar">
    <div class="stage-brand">Presence <span>· Demo-Regie</span></div>
    <div class="stage-controls">
      <label class="stage-field">
        Szenario
        <select id="ctl-scenario">
          <option value="feierabend">Feierabend</option>
          <option value="gymtag">Gym-Tag</option>
          <option value="nacht">Nacht</option>
        </select>
      </label>
      <div class="stage-field">
        Tempo
        <div class="seg" id="ctl-speed">
          <button data-speed="1" class="on">1×</button>
          <button data-speed="10">10×</button>
          <button data-speed="60">60×</button>
        </div>
      </div>
      <div class="stage-clock" id="stage-clock">18:00</div>
      <button id="ctl-reset" class="stage-reset" title="Demo zurücksetzen">↺ Reset</button>
    </div>
  </header>

  <!-- Telefon -->
  <main id="stage">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="statusbar"><span>9:41</span><span class="statusbar-right">5G ▮▮▮▯</span></div>
      <div id="app"><!-- Screens werden hier gemountet --></div>
      <nav id="tabbar">
        <button data-tab="dashboard" class="on"><span class="tab-ico">◉</span>Kreis</button>
        <button data-tab="moments"><span class="tab-ico">✦</span>Momente</button>
        <button data-tab="vault"><span class="tab-ico">▤</span>Vault</button>
        <button data-tab="me"><span class="tab-ico">◌</span>Du</button>
      </nav>
      <div class="homebar"></div>
    </div>
    <p class="stage-hint">Klickbarer Konzept-Prototyp „Presence 2.0" · simulierte Daten · kein echtes Backend</p>
  </main>

  <button id="regie-fab" title="Demo-Regie" aria-label="Demo-Regie öffnen">⚙</button>
  <div id="toasts"></div>
  <div id="sheet-root"></div>

  <script type="module" src="js/app.js?v=ap7"></script>
</body>
</html>
